<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav> 
    <a href="/">Home</a>
    <a href="/artisans">Find Artisan</a>
    <a href="/register">Register</a>
    <a href="/login">Login</a>
</nav>

<h1 class="title">Registered Users</h1>

{% if message %}
    <p style="color: green;">{{ message }}</p>
{% endif %}    

<div class="users-container">
    {% for user in users %}
        <div class="user-card">
            <h3>{{ user.name }}</h3>
            <p>{{ user.email }}</p>

            <a href="/edit/{{ user.id }}" class="edit-btn">Edit</a>
            <form method="POST" action="/delete/{{ user.id }}" style="display:inline;" onsubmit="return confirm('Delete this user?')">
                <button type="submit" class="delete-btn">Delete</button>
            </form>
        </div>
    {% endfor %}   
</div>
    
</body>
</html>
