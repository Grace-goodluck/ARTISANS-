<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book {{ artisan.name }} | Artisaan's Crib</title>
    <meta name="theme-color" content="#022f05">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #022f05; color: #fff8dc; min-height: 100vh; }
        nav { display: flex; align-items: center; gap: 20px; padding: 14px 32px; background: rgba(2,47,5,0.97); border-bottom: 1px solid rgba(196,155,58,0.2); }
        nav a { color: #fff8dc; text-decoration: none; font-size: 15px; opacity: 0.85; }
        nav a:hover { color: #c49b3a; opacity: 1; }
        nav a:first-child { margin-right: auto; font-weight: 800; font-size: 17px; opacity: 1; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 80px; }
        h1 { font-size: 24px; font-weight: 900; color: #fff8dc; margin-bottom: 4px; }
        .sub { color: rgba(255,248,220,0.5); font-size: 14px; margin-bottom: 28px; }
        .artisan-strip { display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(196,155,58,0.2); border-radius: 14px; padding: 16px 20px; margin-bottom: 28px; }
        .artisan-strip img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid #c49b3a; }
        .artisan-strip .ph { width: 56px; height: 56px; border-radius: 50%; background: rgba(196,155,58,0.1); display: flex; align-items: center; justify-content: center; color: #c49b3a; font-size: 22px; }
        .strip-name { font-size: 17px; font-weight: 800; }
        .strip-skill { font-size: 13px; color: #c49b3a; }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 12px; font-weight: 700; color: #c49b3a; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 7px; }
        .field input, .field textarea { width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.07); border: 1px solid rgba(196,155,58,0.3); border-radius: 8px; color: #fff8dc; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
        .field input:focus, .field textarea:focus { border-color: #c49b3a; }
        .field textarea { resize: vertical; }
        .btn-submit { width: 100%; background: #c49b3a; color: #022f05; font-weight: 800; font-size: 16px; padding: 14px; border: none; border-radius: 30px; cursor: pointer; margin-top: 8px; transition: transform 0.2s; }
        .btn-submit:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
<nav>
    <a href="/"><i class="fa-solid fa-house"></i> Artisaan's Crib</a>
    <a href="/artisan/{{ artisan.id }}"><i class="fa-solid fa-arrow-left"></i> Back to Profile</a>
</nav>
<div class="wrap">
    <h1><i class="fa-solid fa-calendar-check" style="color:#c49b3a;"></i> Book Appointment</h1>
    <p class="sub">Send a booking request to this artisan. They will contact you to confirm.</p>

    <div class="artisan-strip">
        {% if artisan.image %}
        <img src="{{ artisan.image if artisan.image.startswith('http') else '/static/uploads/' + artisan.image }}" alt="{{ artisan.name }}">
        {% else %}
        <div class="ph"><i class="fa-solid fa-user"></i></div>
        {% endif %}
        <div>
            <div class="strip-name">{{ artisan.name }}</div>
            <div class="strip-skill"><i class="fa-solid fa-hammer"></i> {{ artisan.skill }} &nbsp;·&nbsp; <i class="fa-solid fa-location-dot"></i> {{ artisan.location }}</div>
        </div>
    </div>

    <form method="POST">
        <div class="field">
            <label>Your Name</label>
            <input type="text" name="client_name" placeholder="Full name" required>
        </div>
        <div class="field">
            <label>Your Phone</label>
            <input type="tel" name="client_phone" placeholder="08012345678" required>
        </div>
        <div class="field">
            <label>Your Email (optional)</label>
            <input type="email" name="client_email" placeholder="you@email.com">
        </div>
        <div class="field">
            <label>Preferred Date</label>
            <input type="date" name="service_date" required>
        </div>
        <div class="field">
            <label>Note / Service Details</label>
            <textarea name="note" rows="4" placeholder="Describe what you need help with..."></textarea>
        </div>
        <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Send Booking Request</button>
    </form>
</div>

<!-- MOBILE BACK BUTTON -->
<button class="mobile-back-btn" onclick="history.back()" aria-label="Go back">
    <i class="fa-solid fa-arrow-left"></i>
</button>
<style>
.mobile-back-btn { display: none; position: fixed; bottom: 28px; left: 20px; width: 50px; height: 50px; border-radius: 50%; background: #c49b3a; color: #022f05; border: none; font-size: 20px; cursor: pointer; z-index: 1000; box-shadow: 0 4px 18px rgba(0,0,0,0.35); align-items: center; justify-content: center; transition: transform 0.2s, box-shadow 0.2s; }
.mobile-back-btn:hover { transform: scale(1.08); }
@media(max-width: 768px) { .mobile-back-btn { display: flex; } }
</style>
</body>
</html>
