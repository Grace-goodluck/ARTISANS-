<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Artisaan's Crib</title>
    <meta name="theme-color" content="#022f05">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/logo.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #022f05; color: #fff8dc; min-height: 100vh; }
        nav { display: flex; align-items: center; gap: 24px; padding: 16px 40px; background: rgba(2,47,5,0.97); border-bottom: 1px solid rgba(196,155,58,0.2); position: sticky; top: 0; z-index: 100; }
        nav .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; color: #fff8dc; text-decoration: none; margin-right: auto; }
        nav .brand img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        nav a { color: #fff8dc; text-decoration: none; font-size: 15px; opacity: 0.85; transition: opacity 0.2s, color 0.2s; }
        nav a:hover { opacity: 1; color: #c49b3a; }
        .nav-register { background: #c49b3a; color: #022f05 !important; font-weight: 700; padding: 8px 18px; border-radius: 20px; opacity: 1 !important; }
        .nav-register:hover { background: #e0b84a !important; }
        .page-wrap { min-height: calc(100vh - 73px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(196,155,58,0.2); border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 440px; }
        .card-logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; }
        .card-logo img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #c49b3a; margin-bottom: 12px; }
        .card-logo h1 { font-size: 26px; font-weight: 800; color: #fff8dc; }
        .card-logo p { font-size: 14px; color: rgba(255,248,220,0.6); margin-top: 4px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #c49b3a; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 7px; }
        .field input { width: 100%; padding: 13px 16px; border-radius: 10px; border: 1px solid rgba(196,155,58,0.3); background: rgba(255,255,255,0.07); color: #fff8dc; font-size: 15px; outline: none; transition: border 0.2s; }
        .field input:focus { border-color: #c49b3a; }
        .field input::placeholder { color: rgba(255,248,220,0.35); }
        .pass-wrap { position: relative; }
        .pass-wrap input { padding-right: 44px; }
        .eye-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,248,220,0.5); cursor: pointer; font-size: 16px; padding: 0; }
        .eye-btn:hover { color: #c49b3a; }
        .error-msg { background: rgba(220,50,50,0.15); border: 1px solid rgba(220,50,50,0.4); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: #ff8888; margin-bottom: 18px; }
        .btn-primary { width: 100%; padding: 14px; border-radius: 30px; background: #c49b3a; color: #022f05; font-weight: 800; font-size: 16px; border: none; cursor: pointer; transition: background 0.2s, transform 0.2s; margin-top: 6px; }
        .btn-primary:hover { background: #e0b84a; transform: translateY(-1px); }
        .card-links { text-align: center; margin-top: 22px; font-size: 14px; color: rgba(255,248,220,0.6); }
        .card-links a { color: #c49b3a; text-decoration: none; font-weight: 600; }
        .card-links a:hover { text-decoration: underline; }
        @media(max-width:480px) { .card { padding: 32px 24px; } nav { padding: 14px 20px; gap: 14px; } }
    </style>
</head>
<body>
<nav>
    <a href="/" class="brand"><img src="/static/logo.jpeg" alt="Logo"> Artisaan's Crib</a>
    <a href="/artisans"><i class="fa-solid fa-users"></i> Find Artisan</a>
    {% if session.user_id %}
        <a href="/add-artisan" class="nav-register"><i class="fa-solid fa-plus"></i> Register as Artisan</a>
        <a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    {% else %}
        <a href="/login"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
        <a href="/register"><i class="fa-solid fa-user-plus"></i> Register</a>
    {% endif %}
</nav>

<div class="page-wrap">
    <div class="card">
        <div class="card-logo">
            <img src="/static/logo.jpeg" alt="Logo">
            <h1>Create Account</h1>
            <p>Join Artisaan's Crib today</p>
        </div>
        {% if error %}
        <div class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="field">
                <label>Full Name</label>
                <input type="text" name="fullname" placeholder="Enter your full name" required>
            </div>
            <div class="field">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="pass-wrap">
                    <input type="password" name="password" id="password" placeholder="Create a password" required>
                    <button type="button" class="eye-btn" onclick="togglePassword()">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary"><i class="fa-solid fa-user-plus"></i> Create Account</button>
        </form>
        <div class="card-links">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>
</div>
<script>
function togglePassword() {
    var p = document.getElementById("password");
    var icon = document.getElementById("eyeIcon");
    if (p.type === "password") { p.type = "text"; icon.className = "fa-solid fa-eye-slash"; }
    else { p.type = "password"; icon.className = "fa-solid fa-eye"; }
}
</script>
</body>
</html>
