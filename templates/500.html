<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong — Artisaan's Crib</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #022f05; font-family: 'Segoe UI', Arial, sans-serif; color: #fff8dc; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; }
        .wrap { max-width: 480px; }
        .icon { font-size: 64px; color: #c49b3a; margin-bottom: 24px; }
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 12px; }
        p { font-size: 16px; opacity: 0.7; line-height: 1.7; margin-bottom: 32px; }
        a { display: inline-flex; align-items: center; gap: 8px; background: #c49b3a; color: #022f05; font-weight: 800; padding: 13px 32px; border-radius: 30px; text-decoration: none; }
        a:hover { background: #e0b84a; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h1>Something went wrong</h1>
        <p>We hit an unexpected error. Please go back to the home page and try again.</p>
        <a href="/"><i class="fa-solid fa-house"></i> Back to Home</a>
    </div>
</body>
</html>
