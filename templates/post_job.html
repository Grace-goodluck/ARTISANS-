<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | Artisaan's Crib</title>
    <meta name="theme-color" content="#022f05">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #022f05; color: #fff8dc; min-height: 100vh; }
        nav { display: flex; align-items: center; gap: 20px; padding: 14px 32px; background: rgba(2,47,5,0.97); border-bottom: 1px solid rgba(196,155,58,0.2); }
        nav a { color: #fff8dc; text-decoration: none; font-size: 15px; opacity: 0.85; }
        nav a:hover { color: #c49b3a; opacity: 1; }
        nav a:first-child { margin-right: auto; font-weight: 800; font-size: 17px; opacity: 1; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 80px; }
        h1 { font-size: 24px; font-weight: 900; color: #c49b3a; margin-bottom: 6px; }
        .sub { color: rgba(255,248,220,0.5); font-size: 14px; margin-bottom: 28px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 12px; font-weight: 700; color: #c49b3a; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 7px; }
        .field input, .field textarea, .field select { width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.07); border: 1px solid rgba(196,155,58,0.3); border-radius: 8px; color: #fff8dc; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
        .field input:focus, .field textarea:focus, .field select:focus { border-color: #c49b3a; }
        .field select option { background: #022f05; }
        .field textarea { resize: vertical; }
        .btn-submit { width: 100%; background: #c49b3a; color: #022f05; font-weight: 800; font-size: 16px; padding: 14px; border: none; border-radius: 30px; cursor: pointer; margin-top: 8px; }
        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>
<nav>
    <a href="/"><i class="fa-solid fa-house"></i> Artisaan's Crib</a>
    <a href="/jobs"><i class="fa-solid fa-arrow-left"></i> Back to Jobs</a>
</nav>
<div class="wrap">
    <h1><i class="fa-solid fa-briefcase"></i> Post a Job</h1>
    <p class="sub">Describe what you need done. Interested artisans will reach out to you directly.</p>
    <form method="POST">
        <div class="field">
            <label>Job Title</label>
            <input type="text" name="title" placeholder="e.g. Need a plumber to fix a leaking pipe" required>
        </div>
        <div class="field">
            <label>Skill Needed</label>
            <input type="text" name="skill_needed" placeholder="e.g. Plumber, Electrician, Tailor..." required>
        </div>
        <div class="field">
            <label>Location</label>
            <input type="text" name="location" placeholder="e.g. Lagos Island, Abuja" required>
        </div>
        <div class="field">
            <label>Budget (optional)</label>
            <input type="text" name="budget" placeholder="e.g. ₦5,000 to ₦15,000">
        </div>
        <div class="field">
            <label>Job Description</label>
            <textarea name="description" rows="4" placeholder="Give more detail about what you need done..."></textarea>
        </div>
        <div class="field">
            <label>Your Name</label>
            <input type="text" name="client_name" placeholder="Your full name" required>
        </div>
        <div class="field">
            <label>Your Phone</label>
            <input type="tel" name="client_phone" placeholder="08012345678" required>
        </div>
        <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Post Job</button>
    </form>
</div>
<button class="mobile-back-btn" onclick="history.back()" aria-label="Go back"><i class="fa-solid fa-arrow-left"></i></button>
<style>.mobile-back-btn{display:none;position:fixed;bottom:28px;left:20px;width:50px;height:50px;border-radius:50%;background:#c49b3a;color:#022f05;border:none;font-size:20px;cursor:pointer;z-index:1000;box-shadow:0 4px 18px rgba(0,0,0,0.35);align-items:center;justify-content:center;}@media(max-width:768px){.mobile-back-btn{display:flex;}}</style>
</body>
</html>
