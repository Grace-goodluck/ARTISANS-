<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Artisan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="form-container">    

    <h2>Register as an Artisan</h2>

    <form method="POST" enctype="multipart/form-data">

        <h3> 1. Personal Information</h3>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob">
        </div>

        <div class="form-group">
            <label>Gender</label>
            <select name="gender">
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Profile Picture</label>
            <input type="file" name="profile_pic">
        </div>

        <div class="form-group">
            <label>Skill</label>
            <input type="text" name="skill" placeholder="e.g. Tailor, Carpenter">
        </div>

        <div class="form-group">
            <label>City</label>
            <input type="text" name="city" placeholder="Enter your city">
        </div>

        <div class="form-group">
            <label>State</label>
            <select name="state">
                <option value="">Select your state</option>
                <option value="Lagos">Lagos</option>
                <option value="Abuja">Abuja</option>
                <option value="Rivers">Rivers</option>
                <option value="Delta">Delta</option>
                <option value="Oyo">Oyo</option>
            </select>
        </div>

        <div class="form-group">
            <label>Years of Experience</label>
            <input type="number" name="experience" placeholder="e.g. 3">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="Enter phone number">
        </div>

        <div class="form-group">
            <label>Whatsapp Number (Optional)</label>
            <input type="text" name="whatsapp" placeholder="Enter whatsapp number">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" placeholder="Tell us about your work"></textarea>
        </div>

        <div class="form-group">
            <label>Upload Product Photos (Max 5)</label>
            <input type="file" name="portfolio" multiple>
        </div>

        <div class="form-group">
            <label>Do you accept custom orders?</label>

            <input type="radio" name="custom_orders" value="Yes"> Yes
            <input type="radio" name="custom_orders" value="No"> No
        </div>

        <div class="form-group">
            <label>How do you market your products?</label><br>

            <input type="checkbox" name="marketing[]" value="Online">Online
            <input type="checkbox" name="marketing[]" value="Local Shop">Local Shop
            <input type="checkbox" name="marketing[]" value="Fairs">Fairs
            <input type="checkbox" name="marketing[]" value="Export">Export
        </div>

        <div class="form-group">
            <input type="checkbox" name="terms" required>
            <label>
                I agree to the <a href="a">Terms & Conditions</a> and <a href="#">Privacy Policy</a>
            </label>
        </div>
    
        <button type="submit">Submit Registration</button>
    </form>

</div>    
    
</body>
</html>
